services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
